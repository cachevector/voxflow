[package]
name = "voxflow"
version.workspace = true
edition.workspace = true

[lib]
name = "voxflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "voxflow"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-positioner = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"

voxflow-audio.workspace = true
voxflow-config.workspace = true
voxflow-core.workspace = true
voxflow-cost.workspace = true
voxflow-history.workspace = true
voxflow-insert.workspace = true
voxflow-provider.workspace = true
voxflow-router.workspace = true
voxflow-secrets.workspace = true
voxflow-platform.workspace = true
voxflow-whisper.workspace = true
