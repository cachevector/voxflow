app-id: com.maskedsyntax.VoxFlow
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: voxflow
finish-args:
  - --share=network
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=x11
  - --device=dri
  - --talk-name=org.freedesktop.secrets
modules:
  - name: voxflow
    buildsystem: simple
    build-commands:
      - install -Dm755 voxflow /app/bin/voxflow
    sources:
      - type: dir
        path: ../../
